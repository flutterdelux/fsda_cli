name: ui_pag
description: FSDA UI Pagination blueprint.
version: 1.0.0+1
environment:
  mason: ">=0.1.0-dev.54 <0.1.0"
vars:
  module:
    type: string
    description: The snake_case name of the module (e.g. finance)
  feature:
    type: string
    description: The snake_case name of the feature (e.g. wallet)
  slice:
    type: string
    description: The snake_case name of the slice (e.g. list)
  entity:
    type: string
    description: The snake_case name of the entity (e.g. payment_entity)
  object:
    type: string
    description: The snake_case name of the object name (e.g. manual_payment_method)