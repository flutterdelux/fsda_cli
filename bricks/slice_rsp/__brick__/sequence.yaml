remote_data_source_contract:
  import: |
    import '../dtos/{{model.snakeCase()}}_dto.dart';
    import '../requests/{{feature.snakeCase()}}_{{slice.snakeCase()}}_request.dart';
  code: |
    {{#is_list}}Stream<List<{{model.pascalCase()}}Dto>> {{method.camelCase()}}({{/is_list}}
    {{^is_list}}Stream<{{model.pascalCase()}}Dto> {{method.camelCase()}}({{/is_list}}
      {{feature.pascalCase()}}{{slice.pascalCase()}}Request {{feature.camelCase()}}{{slice.pascalCase()}}Request,
    );

remote_data_source_impl:
  import: |
    import '../dtos/{{model.snakeCase()}}_dto.dart';
    import '../requests/{{feature.snakeCase()}}_{{slice.snakeCase()}}_request.dart';
  code: |
    @override
    {{#is_list}}Stream<List<{{model.pascalCase()}}Dto>> {{method.camelCase()}}({{/is_list}}
    {{^is_list}}Stream<{{model.pascalCase()}}Dto> {{method.camelCase()}}({{/is_list}}
      {{feature.pascalCase()}}{{slice.pascalCase()}}Request {{feature.camelCase()}}{{slice.pascalCase()}}Request,
    ) async* {
      final path = '/{{feature.paramCase()}}s/${{{feature.camelCase()}}{{slice.pascalCase()}}Request.id}/{{slice.paramCase()}}/stream';
      try {
        {{#is_list}}await for (final data in _apiClient.stream<List>(path)) {
          yield data.map((e) => {{model.pascalCase()}}Dto.fromJson(e as Map<String, dynamic>)).toList();
        }{{/is_list}}
        {{^is_list}}await for (final data in _apiClient.stream<Map<String, dynamic>>(path)) {
          yield {{model.pascalCase()}}Dto.fromJson(data);
        }{{/is_list}}
      } catch (e, st) {
        if (e is AppException) {
          if (e.message.contains('404')) {
            throw {{module.pascalCase()}}Exception.{{feature.camelCase()}}NotFound(msg: e.message, st: st);
          }
        }
        throw {{module.pascalCase()}}Exception.fromException(e, st: st);
      }
    }

repository_contract:
  import: |
    import '../entities/{{model.snakeCase()}}_entity.dart';
    import '../params/{{feature.snakeCase()}}_{{slice.snakeCase()}}_param.dart';
  code: |
    {{#is_list}}StreamResult<List<{{model.pascalCase()}}Entity>> {{method.camelCase()}}({{feature.pascalCase()}}{{slice.pascalCase()}}Param param);{{/is_list}}
    {{^is_list}}StreamResult<{{model.pascalCase()}}Entity> {{method.camelCase()}}({{feature.pascalCase()}}{{slice.pascalCase()}}Param param);{{/is_list}}

repository_impl:
  import: |
    import '../../domain/entities/{{model.snakeCase()}}_entity.dart';
    import '../../domain/params/{{feature.snakeCase()}}_{{slice.snakeCase()}}_param.dart';
    import '../requests/{{feature.snakeCase()}}_{{slice.snakeCase()}}_request.dart';
  code: |
    @override
    {{#is_list}}StreamResult<List<{{model.pascalCase()}}Entity>> {{method.camelCase()}}({{/is_list}}
    {{^is_list}}StreamResult<{{model.pascalCase()}}Entity> {{method.camelCase()}}({{/is_list}}
      {{feature.pascalCase()}}{{slice.pascalCase()}}Param param,
    ) async* {
      try {
        final request = {{feature.pascalCase()}}{{slice.pascalCase()}}Request.fromParam(param);
        final stream = _remoteDataSource.{{method.camelCase()}}(request);

        {{#is_list}}await for (final dtos in stream) {
          final entities = dtos.map((dto) => dto.toEntity()).toList();
          yield Result.success(entities);
        }{{/is_list}}
        {{^is_list}}await for (final dto in stream) {
          final entity = dto.toEntity();
          yield Result.success(entity);
        }{{/is_list}}
      } catch (e, st) {
        yield handleException('{{method.camelCase()}}', e, st);
      }
    }

export:
  domain: |
    export 'domain/usecases/{{feature.snakeCase()}}_{{slice.snakeCase()}}_use_case.dart';
  logic: |
    export 'logic/{{slice.snakeCase()}}/{{feature.snakeCase()}}_{{slice.snakeCase()}}_cubit.dart';
    export 'logic/{{slice.snakeCase()}}/{{feature.snakeCase()}}_{{slice.snakeCase()}}_state.dart';

post_hooks:
  - dart run build_runner build --force-jit