    {{#is_list}}Future<List<{{model.pascalCase()}}Dto>> {{method.camelCase()}}();{{/is_list}}
    {{^is_list}}{{model.pascalCase()}}Dto {{method.camelCase()}}();{{/is_list}}
    {{#is_list}}Future<void> cache{{feature.pascalCase()}}{{slice.pascalCase()}}(List<{{model.pascalCase()}}Dto> data);{{/is_list}}
    {{^is_list}}Future<void> cache{{feature.pascalCase()}}{{slice.pascalCase()}}({{model.pascalCase()}}Dto data);{{/is_list}}

local_data_source_impl:
  import: |
    import '../dtos/{{model.snakeCase()}}_dto.dart';
    import '{{feature.snakeCase()}}_local_data_source.dart';
  code: |
    {{#is_list}}@override
    Future<List<{{model.pascalCase()}}Dto>> {{method.camelCase()}}() async {
      try {
        final rows = await _client.findAll('{{feature.snakeCase()}}s');
        return rows.map((row) => {{model.pascalCase()}}Dto.fromJson(row)).toList();
      } catch (e, st) {
        throw CoreException.cacheError(
          msg: 'Failed to load {{feature.snakeCase()}}s from local cache: $e',
          st: st,
        );
      }
    }

    @override
    Future<void> cache{{feature.pascalCase()}}{{slice.pascalCase()}}(List<{{model.pascalCase()}}Dto> data) async {
      try {
        await _client.insertMany(
          '{{feature.snakeCase()}}s',
          data.map((item) => item.toJson()).toList(),
        );
      } catch (e, st) {
        throw CoreException.cacheError(
          msg: 'Failed to cache {{feature.snakeCase()}}s to local storage: $e',
          st: st,
        );
      }
    }{{/is_list}}
    {{^is_list}}@override
    {{model.pascalCase()}}Dto {{method.camelCase()}}() {
      final json = _localStorage.read('{{feature.snakeCase()}}_{{slice.snakeCase()}}');
      if (json is String) {
        final {{model.camelCase()}}Map = jsonDecode(json) as Map<String, dynamic>;
        return {{model.pascalCase()}}Dto.fromJson({{model.camelCase()}}Map);
      }
      throw const CoreException.cacheError();
    }

    @override
    Future<void> cache{{feature.pascalCase()}}{{slice.pascalCase()}}({{model.pascalCase()}}Dto data) async {
      try {
        final json = jsonEncode(data.toJson());
        await _localStorage.write('{{feature.snakeCase()}}_{{slice.snakeCase()}}', json);
      } catch (e, st) {
        throw CoreException.cacheError(
          msg: 'Failed to cache {{feature.snakeCase()}}_{{slice.snakeCase()}} to local storage: $e',
          st: st,
        );
      }
    }{{/is_list}}

