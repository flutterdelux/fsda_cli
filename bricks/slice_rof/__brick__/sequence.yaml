repository_contract:
  import: |
    import '../entities/{{model.snakeCase()}}_entity.dart';
  code: |
    {{#is_list}}AsyncResult<List<{{model.pascalCase()}}Entity>> {{method.camelCase()}}();{{/is_list}}
    {{^is_list}}AsyncResult<{{model.pascalCase()}}Entity> {{method.camelCase()}}();{{/is_list}}

repository_impl:
  import: |
    import '../../domain/entities/{{model.snakeCase()}}_entity.dart';
  code: |
    {{#is_list}}@override
    AsyncResult<List<{{model.pascalCase()}}Entity>> {{method.camelCase()}}() async {
      final isOnline = await _networkInfo.hasInternetAccess;

      if (isOnline) {
        try {
          final {{model.camelCase()}}Dtos = await _remoteDataSource.{{method.camelCase()}}();
          await _localDataSource.cache{{feature.pascalCase()}}{{slice.pascalCase()}}({{model.camelCase()}}Dtos);
        } catch (e, st) {
          log.warning(
            '{{method.camelCase()}} refresh cache failed',
            error: e,
            stackTrace: st,
          );
        }
      }

      try {
        final cachedData = await _localDataSource.{{method.camelCase()}}();
        return Result.success(cachedData.map((dto) => dto.toEntity()).toList());
      } catch (e, st) {
        return handleException('{{method.camelCase()}}', e, st);
      }
    }{{/is_list}}
    {{^is_list}}@override
    AsyncResult<{{model.pascalCase()}}Entity> {{method.camelCase()}}() async {
      final isOnline = await _networkInfo.hasInternetAccess;

      if (isOnline) {
        try {
          final {{model.camelCase()}}Dto = await _remoteDataSource.{{method.camelCase()}}();
          await _localDataSource.cache{{feature.pascalCase()}}{{slice.pascalCase()}}({{model.camelCase()}}Dto);
        } catch (e, st) {
          log.warning(
            '{{method.camelCase()}} refresh cache failed',
            error: e,
            stackTrace: st,
          );
        }
      }

      try {
        final cachedData = _localDataSource.{{method.camelCase()}}();
        return Result.success(cachedData.toEntity());
      } catch (e, st) {
        return handleException('{{method.camelCase()}}', e, st);
      }
    }{{/is_list}}

