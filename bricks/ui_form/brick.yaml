name: ui_form
description: FSDA UI Form blueprint.
version: 1.0.0+1
environment:
  mason: ">=0.1.0-dev.54 <0.1.0"
vars:
  module:
    type: string
    description: The snake_case name of the module (e.g. task)
  feature:
    type: string
    description: The snake_case name of the feature (e.g. task)
  slice:
    type: string
    description: The snake_case name of the slice (e.g. create)
  type:
    type: string
    description: The snake_case name of the data type for result data and initial data (e.g. task_entity)
  type_import_ui:
    type: string
  type_import_logic:
    type: string